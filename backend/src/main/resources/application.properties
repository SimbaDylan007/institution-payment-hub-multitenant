
# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db
spring.datasource.username=root
spring.datasource.password=Simba
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# External API configuration
zb.api.base-url=https://zbnet.zb.co.zw
zb.api.pick-pending-path=/alerts/payments/pick-all-pending
zb.api.all-payments-path=/alerts/payments/all-payments

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.payments=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
